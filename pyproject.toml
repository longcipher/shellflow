[project]
name = "shellflow"
version = "0.4.9"
description = "A minimal shell script orchestrator with SSH support"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Bob Liu" }]
keywords = ["shell", "ssh", "orchestration", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]
dependencies = ["paramiko>=5.0.0", "pydantic>=2.13.4"]

[project.urls]
Homepage = "https://github.com/longcipher/shellflow"
Repository = "https://github.com/longcipher/shellflow"
Issues = "https://github.com/longcipher/shellflow/issues"

[project.scripts]
shellflow = "shellflow.main:main"

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shellflow"]

[tool.hatch.build.targets.wheel.force-include]
"src/shellflow_models.py" = "shellflow_models.py"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.2.3",
    "ruff>=0.15.22",
    "ty>=0.0.60",
    "behave>=1.3.3",
    "hypothesis>=6.156.6",
    "shellflow",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks benchmark tests",
]
asyncio_mode = "auto"

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
shellflow = { workspace = true, editable = true }
