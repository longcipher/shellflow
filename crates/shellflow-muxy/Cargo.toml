[package]
name = "shellflow-muxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Muxy native-protocol transport for shellflow: frame-to-line assembly, payload delivery, and session outcomes."
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
# Not publishable: it depends on `muxy-client`/`muxy-protocol`, which are
# git-only beta crates (pinned by rev) and are absent from crates.io. Only the
# `bin/shellflow` binary consumes it, through the optional `muxy` feature.
publish = false

[dependencies]
muxy-client = { workspace = true }
muxy-protocol = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
