[package]
name = "shellflow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A shell-native, agentless automation tool that runs commands over SSH concurrently and idempotently."
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
age = { workspace = true }
clap = { workspace = true, features = ["derive"] }
colored = { workspace = true }
eyre = { workspace = true }
nix = { workspace = true, features = ["process", "signal", "user"] }
serde_json = { workspace = true }
shellflow-core = { workspace = true }
shellflow-secrets = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml_edit = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
