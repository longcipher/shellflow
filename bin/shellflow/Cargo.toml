[package]
name = "shellflow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A shell-native, agentless automation tool that runs commands over SSH concurrently and idempotently."
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
# Not publishable: its default `muxy` feature pulls in `shellflow-muxy`, which
# depends on git-only beta crates absent from crates.io. The binary is a
# build-from-source product; the library crates below are the published artifacts.
publish = false

[features]
# Event-driven systemd unit state (D-Bus). Off by default so the standard
# build stays a single static binary with no D-Bus dependency; the CLI path
# produces the same output by polling.
default = ["muxy"]
dbus = ["dep:zbus", "dep:futures-util"]
# Native Muxy protocol transport (one connection per host, frame streaming).
# Off (`--no-default-features`) for lean static musl builds and air-gapped
# packaging; the ssh transport then covers every step.
muxy = ["dep:shellflow-muxy"]

[dependencies]
clap = { workspace = true, features = ["derive"] }
colored = { workspace = true }
eyre = { workspace = true }
futures-util = { workspace = true, optional = true }
nix = { workspace = true, features = ["process", "signal", "user", "fs"] }
sd-notify = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shellflow-core = { workspace = true }
shellflow-muxy = { workspace = true, optional = true }
shellflow-secrets = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml_edit = { workspace = true }
zbus = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
