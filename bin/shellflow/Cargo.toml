[package]
name = "shellflow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A shell-native, agentless automation tool that runs commands over SSH concurrently and idempotently."
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[features]
# Event-driven systemd unit state (D-Bus). Off by default so the standard
# build stays a single static binary with no D-Bus dependency; the CLI path
# produces the same output by polling.
default = []
dbus = ["dep:zbus", "dep:futures-util"]

[dependencies]
age = { workspace = true }
clap = { workspace = true, features = ["derive"] }
colored = { workspace = true }
eyre = { workspace = true }
futures-util = { workspace = true, optional = true }
nix = { workspace = true, features = ["process", "signal", "user", "fs"] }
sd-notify = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shellflow-core = { workspace = true }
shellflow-secrets = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml_edit = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zbus = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
