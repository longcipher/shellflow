[package]
name = "shellflow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A shell-native, agentless automation tool that runs commands over SSH concurrently and idempotently."
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
rust-version.workspace = true

[dependencies]
age = { workspace = true }
clap = { workspace = true, features = ["derive"] }
colored = { workspace = true }
eyre = { workspace = true }
shellflow-core = { path = "../../crates/shellflow-core", version = "0.1.0" }
shellflow-secrets = { path = "../../crates/shellflow-secrets", version = "0.1.0" }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
nix = { version = "0.29", features = ["signal"] }

[lints]
workspace = true
