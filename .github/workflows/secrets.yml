name: Secrets

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -sSfL "${base}/gitleaks_${version}_linux_x64.tar.gz" -o "/tmp/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL "${base}/gitleaks_${version}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          (cd /tmp && grep " gitleaks_${version}_linux_x64.tar.gz$" gitleaks_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/gitleaks_${version}_linux_x64.tar.gz" -C /usr/local/bin gitleaks

      - name: Scan git history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="--all"

      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner
